name: Build Jazz Trainer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
      
      - name: Build APK with Briefcase
        run: |
          cd jazztrainer
          briefcase build android
        timeout-minutes: 120
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jazz-trainer-apk
          path: jazztrainer/build/jazztrainer/android/gradle/app/build/outputs/apk/debug/*.apk
          retention-days: 30

