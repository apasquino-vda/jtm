[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "jazztrainer"
version = "0.0.1"
description = "Jazz Trainer Application"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}  # ← ADD THIS LINE (or use the appropriate license)
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

[tool.briefcase]
project_name = "Jazz Trainer"
bundle = "com.example"
version = "0.0.1"
description = "A jazz training application"
sources = ["src/jazztrainer"]

