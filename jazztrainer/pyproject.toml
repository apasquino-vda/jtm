[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "jazztrainer"
version = "0.0.1"
description = "A jazz training application"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Andrea Pasquino", email = "Andrea.Pasquino@insight.com"}
]

[tool.briefcase]
project_name = "Jazz Trainer"
bundle = "com.example"
version = "0.0.1"
description = "A jazz training application"
sources = ["src/jazztrainer"]

