[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Jazz Trainer"
version = "1.0.0"
description = "Jazz chord training app"
authors = [{name = "Your Name", email = "your@email.com"}]
requires-python = ">=3.8"
dependencies = ["kivy"]

[tool.briefcase]
project_name = "Jazz Trainer"
bundle = "org.jazztrainer"
url = "https://example.com"
license = "MIT"
author = "Your Name"
author_email = "your@email.com"

[tool.briefcase.app.jazztrainer]
formal_name = "Jazz Trainer"
description = "Jazz chord training app"
sources = ["src/jazz_trainer"]

[tool.briefcase.app.jazztrainer.android]
requires = ["kivy", "pyjnius"]

