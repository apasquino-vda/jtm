[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jazztrainer"
version = "1.0.0"

[tool.briefcase]
project_name = "Jazz Trainer"
bundle = "org.jazztrainer"
author = "Andrea Pasquino"
author_email = "andrea@example.com"
url = "https://example.com"

[tool.briefcase.app.jazztrainer]
formal_name = "Jazz Trainer"
description = "Jazz chord training app"
sources = ["src"]

[tool.briefcase.app.jazztrainer.android]
requires = ["kivy"]

